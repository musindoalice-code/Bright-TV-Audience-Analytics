<svg viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1f"/>
      <stop offset="55%" stop-color="#151238"/>
      <stop offset="100%" stop-color="#2a0f3d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="50%" stop-color="#ff8a5c"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d5bff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4d5bff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4d5bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="220" fill="url(#screenGlow)"/>
  <circle cx="140" cy="330" r="180" fill="url(#screenGlow)"/>

  <!-- faint scanlines -->
  <g opacity="0.06">
    <rect x="0" y="0" width="1280" height="400" fill="url(#bg)"/>
    <g stroke="#ffffff" stroke-width="1">
      <line x1="0" y1="20" x2="1280" y2="20"/>
      <line x1="0" y1="60" x2="1280" y2="60"/>
      <line x1="0" y1="100" x2="1280" y2="100"/>
      <line x1="0" y1="140" x2="1280" y2="140"/>
      <line x1="0" y1="180" x2="1280" y2="180"/>
      <line x1="0" y1="220" x2="1280" y2="220"/>
      <line x1="0" y1="260" x2="1280" y2="260"/>
      <line x1="0" y1="300" x2="1280" y2="300"/>
      <line x1="0" y1="340" x2="1280" y2="340"/>
      <line x1="0" y1="380" x2="1280" y2="380"/>
    </g>
  </g>

  <!-- title block -->
  <text x="60" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#ffffff">📺 Bright TV Audience Analytics</text>
  <text x="60" y="104" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#c9c9e8">From raw viewing logs to executive-ready insight — an end-to-end SQL &amp; BI story</text>

  <!-- story flow line -->
  <line x1="90" y1="230" x2="1190" y2="230" stroke="url(#lineFade)" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round"/>

  <!-- Stage 1: Raw Data -->
  <g transform="translate(150,230)">
    <circle r="34" fill="#1c1f3d" stroke="#4d5bff" stroke-width="2.5"/>
    <text x="0" y="8" font-size="26" text-anchor="middle">🗃️</text>
    <text x="0" y="60" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Raw Data</text>
    <text x="0" y="80" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#9d9dc9" text-anchor="middle">5,375 subscribers</text>
    <text x="0" y="96" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#9d9dc9" text-anchor="middle">Q1 2016 viewing logs</text>
  </g>

  <!-- Stage 2: Clean and Query -->
  <g transform="translate(470,230)">
    <circle r="34" fill="#1c1f3d" stroke="#7a5bff" stroke-width="2.5"/>
    <text x="0" y="8" font-size="26" text-anchor="middle">🧹</text>
    <text x="0" y="60" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Clean &amp; Query</text>
    <text x="0" y="80" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#9d9dc9" text-anchor="middle">SQL · CTEs · window fns</text>
    <text x="0" y="96" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#9d9dc9" text-anchor="middle">9,983 sessions validated</text>
  </g>

  <!-- Stage 3: Analyze -->
  <g transform="translate(790,230)">
    <circle r="34" fill="#1c1f3d" stroke="#ff8a5c" stroke-width="2.5"/>
    <text x="0" y="8" font-size="26" text-anchor="middle">📊</text>
    <text x="0" y="60" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Analyze &amp; Model</text>
    <text x="0" y="80" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#9d9dc9" text-anchor="middle">KPIs · engagement segments</text>
    <text x="0" y="96" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#9d9dc9" text-anchor="middle">Avg view duration</text>
  </g>

  <!-- Stage 4: Insight -->
  <g transform="translate(1120,230)">
    <circle r="34" fill="#1c1f3d" stroke="#ffd166" stroke-width="2.5"/>
    <text x="0" y="8" font-size="26" text-anchor="middle">💡</text>
    <text x="0" y="60" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Insight</text>
    <text x="0" y="80" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#9d9dc9" text-anchor="middle">5 live dashboards</text>
    <text x="0" y="96" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#9d9dc9" text-anchor="middle">Exec recommendations</text>
  </g>

  <!-- divider -->
  <line x1="60" y1="335" x2="1220" y2="335" stroke="#3a3a5c" stroke-width="1"/>

  <!-- tool chips -->
  <g font-family="Verdana, Arial, sans-serif" font-size="12.5" font-weight="700">
    <g transform="translate(60,358)">
      <rect width="88" height="26" rx="13" fill="#22223f" stroke="#4d5bff" stroke-width="1"/>
      <text x="44" y="17" fill="#dcdcff" text-anchor="middle">SQL</text>
    </g>
    <g transform="translate(158,358)">
      <rect width="120" height="26" rx="13" fill="#22223f" stroke="#ff4d6d" stroke-width="1"/>
      <text x="60" y="17" fill="#ffd0d9" text-anchor="middle">Databricks</text>
    </g>
    <g transform="translate(288,358)">
      <rect width="98" height="26" rx="13" fill="#22223f" stroke="#ffd166" stroke-width="1"/>
      <text x="49" y="17" fill="#fff0c2" text-anchor="middle">Power BI</text>
    </g>
    <g transform="translate(396,358)">
      <rect width="82" height="26" rx="13" fill="#22223f" stroke="#5cd8a8" stroke-width="1"/>
      <text x="41" y="17" fill="#c8f5e4" text-anchor="middle">Excel</text>
    </g>
    <g transform="translate(488,358)">
      <rect width="150" height="26" rx="13" fill="#22223f" stroke="#7a5bff" stroke-width="1"/>
      <text x="75" y="17" fill="#e2d9ff" text-anchor="middle">Google Data Studio</text>
    </g>
    <g transform="translate(648,358)">
      <rect width="100" height="26" rx="13" fill="#22223f" stroke="#ff8a5c" stroke-width="1"/>
      <text x="50" y="17" fill="#ffe0cf" text-anchor="middle">Lovable</text>
    </g>
  </g>

  <text x="1220" y="376" font-family="Verdana, Arial, sans-serif" font-size="12.5" fill="#9d9dc9" text-anchor="end">Analyst: Alice Musindo</text>
</svg>
