<svg viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07060f"/>
      <stop offset="45%" stop-color="#1a0f3d"/>
      <stop offset="100%" stop-color="#3d0f4d"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#39f2c0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#39a0f2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#39a0f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff2fa0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff2fa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39f2c0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2fa0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2fa0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5bff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7a5bff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="tvBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a45"/>
      <stop offset="100%" stop-color="#151428"/>
    </linearGradient>
    <linearGradient id="screenFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1830"/>
      <stop offset="100%" stop-color="#08101f"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="908" y="88" width="230" height="150" rx="10"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="1020" cy="160" r="260" fill="url(#screenGlow)"/>
  <circle cx="260" cy="60" r="200" fill="url(#pinkGlow)"/>

  <!-- scattered static dots -->
  <g fill="#ffffff">
    <circle cx="80" cy="140" r="1.4" opacity="0.35"/>
    <circle cx="200" cy="250" r="1" opacity="0.25"/>
    <circle cx="340" cy="90" r="1.6" opacity="0.3"/>
    <circle cx="620" cy="60" r="1.2" opacity="0.3"/>
    <circle cx="720" cy="300" r="1.4" opacity="0.25"/>
    <circle cx="150" cy="330" r="1.2" opacity="0.3"/>
    <circle cx="500" cy="180" r="1" opacity="0.2"/>
    <circle cx="1200" cy="60" r="1.4" opacity="0.3"/>
    <circle cx="1180" cy="320" r="1.2" opacity="0.25"/>
    <circle cx="60" cy="30" r="1" opacity="0.2"/>
  </g>

  <!-- broadcast color-bar accent strip -->
  <g opacity="0.9">
    <rect x="0" y="0" width="1280" height="6" fill="#f2f2f2"/>
    <rect x="0" y="0" width="182.9" height="6" fill="#f2c40c"/>
    <rect x="182.9" y="0" width="182.9" height="6" fill="#00c2d1"/>
    <rect x="365.8" y="0" width="182.9" height="6" fill="#2fbf4f"/>
    <rect x="548.7" y="0" width="182.9" height="6" fill="#c22fd1"/>
    <rect x="731.6" y="0" width="182.9" height="6" fill="#e8433a"/>
    <rect x="914.5" y="0" width="182.9" height="6" fill="#2f4fe8"/>
    <rect x="1097.1" y="0" width="182.9" height="6" fill="#0d0d12"/>
  </g>

  <!-- streaming waves flowing toward the TV -->
  <path d="M -20 140 C 200 100, 380 190, 560 130 S 820 90, 900 150" fill="none" stroke="url(#wave1)" stroke-width="3" opacity="0.85"/>
  <path d="M -20 200 C 220 240, 400 150, 580 210 S 800 260, 900 190" fill="none" stroke="url(#wave2)" stroke-width="3" opacity="0.8"/>
  <path d="M -20 265 C 240 225, 420 300, 600 250 S 820 200, 900 240" fill="none" stroke="url(#wave3)" stroke-width="3" opacity="0.75"/>

  <!-- Retro TV set -->
  <g transform="translate(0,0)">
    <!-- legs -->
    <rect x="930" y="330" width="10" height="22" rx="2" fill="#151428"/>
    <rect x="1080" y="330" width="10" height="22" rx="2" fill="#151428"/>
    <!-- antenna -->
    <line x1="960" y1="70" x2="920" y2="20" stroke="#c9c9e8" stroke-width="3" stroke-linecap="round"/>
    <line x1="1000" y1="70" x2="1040" y2="20" stroke="#c9c9e8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="920" cy="20" r="4" fill="#ff2fa0"/>
    <circle cx="1040" cy="20" r="4" fill="#00e5ff"/>
    <!-- body -->
    <rect x="890" y="70" width="280" height="270" rx="26" fill="url(#tvBody)" stroke="#3a3a5c" stroke-width="2"/>
    <!-- screen -->
    <rect x="908" y="88" width="230" height="150" rx="10" fill="url(#screenFill)" stroke="#00e5ff" stroke-width="2"/>
    <g clip-path="url(#screenClip)">
      <rect x="908" y="88" width="230" height="150" fill="url(#screenFill)"/>
      <!-- mini bar chart glowing on screen -->
      <g>
        <rect x="925" y="190" width="18" height="35" fill="#00e5ff" opacity="0.9"/>
        <rect x="953" y="165" width="18" height="60" fill="#39f2c0" opacity="0.9"/>
        <rect x="981" y="145" width="18" height="80" fill="#ffd166" opacity="0.9"/>
        <rect x="1009" y="175" width="18" height="50" fill="#ff2fa0" opacity="0.9"/>
        <rect x="1037" y="130" width="18" height="95" fill="#7a5bff" opacity="0.9"/>
        <rect x="1065" y="160" width="18" height="65" fill="#00e5ff" opacity="0.7"/>
        <rect x="1093" y="150" width="18" height="75" fill="#39f2c0" opacity="0.7"/>
      </g>
      <line x1="908" y1="225" x2="1138" y2="225" stroke="#3a3a5c" stroke-width="1"/>
      <text x="1023" y="108" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#8fefe0" text-anchor="middle" letter-spacing="2">● LIVE VIEWERSHIP</text>
    </g>
    <!-- knobs -->
    <circle cx="1152" cy="120" r="10" fill="#0c0c18" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="1152" cy="160" r="10" fill="#0c0c18" stroke="#ff2fa0" stroke-width="2"/>
    <rect x="1140" y="195" width="24" height="8" rx="4" fill="#0c0c18" stroke="#7a5bff" stroke-width="1.5"/>
    <circle cx="1152" cy="240" r="14" fill="#0c0c18" stroke="#3a3a5c" stroke-width="2"/>
    <circle cx="1152" cy="240" r="4" fill="#39f2c0"/>
  </g>

  <!-- title block -->
  <text x="60" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#ffffff">📺 Bright TV Audience Analytics</text>
  <text x="60" y="112" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#c9c9e8">Turning live viewing streams into executive-ready insight</text>

  <!-- stats row -->
  <g font-family="Verdana, Arial, sans-serif">
    <g transform="translate(60,165)">
      <text x="0" y="0" font-size="26" font-weight="700" fill="#00e5ff">5,375</text>
      <text x="0" y="20" font-size="12.5" fill="#9d9dc9">Subscribers</text>
    </g>
    <g transform="translate(210,165)">
      <text x="0" y="0" font-size="26" font-weight="700" fill="#39f2c0">9,983</text>
      <text x="0" y="20" font-size="12.5" fill="#9d9dc9">Viewing Sessions</text>
    </g>
    <g transform="translate(400,165)">
      <text x="0" y="0" font-size="26" font-weight="700" fill="#ffd166">Q1 2016</text>
      <text x="0" y="20" font-size="12.5" fill="#9d9dc9">Data Period</text>
    </g>
    <g transform="translate(575,165)">
      <text x="0" y="0" font-size="26" font-weight="700" fill="#ff2fa0">5</text>
      <text x="0" y="20" font-size="12.5" fill="#9d9dc9">Live Dashboards</text>
    </g>
  </g>

  <!-- tool chips -->
  <g font-family="Verdana, Arial, sans-serif" font-size="12.5" font-weight="700">
    <g transform="translate(60,250)">
      <rect width="88" height="28" rx="14" fill="#161328" stroke="#00e5ff" stroke-width="1.3"/>
      <text x="44" y="19" fill="#c9f7ff" text-anchor="middle">SQL</text>
    </g>
    <g transform="translate(158,250)">
      <rect width="120" height="28" rx="14" fill="#161328" stroke="#ff2fa0" stroke-width="1.3"/>
      <text x="60" y="19" fill="#ffd0ec" text-anchor="middle">Databricks</text>
    </g>
    <g transform="translate(288,250)">
      <rect width="98" height="28" rx="14" fill="#161328" stroke="#ffd166" stroke-width="1.3"/>
      <text x="49" y="19" fill="#fff0c2" text-anchor="middle">Power BI</text>
    </g>
    <g transform="translate(396,250)">
      <rect width="82" height="28" rx="14" fill="#161328" stroke="#39f2c0" stroke-width="1.3"/>
      <text x="41" y="19" fill="#c8f5e4" text-anchor="middle">Excel</text>
    </g>
    <g transform="translate(60,290)">
      <rect width="150" height="28" rx="14" fill="#161328" stroke="#7a5bff" stroke-width="1.3"/>
      <text x="75" y="19" fill="#e2d9ff" text-anchor="middle">Google Data Studio</text>
    </g>
    <g transform="translate(220,290)">
      <rect width="100" height="28" rx="14" fill="#161328" stroke="#00e5ff" stroke-width="1.3"/>
      <text x="50" y="19" fill="#c9f7ff" text-anchor="middle">Lovable</text>
    </g>
  </g>

  <line x1="60" y1="340" x2="1220" y2="340" stroke="#3a3a5c" stroke-width="1"/>
  <text x="60" y="366" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#9d9dc9">Raw subscriber logs → segmented audiences → KPIs → boardroom-ready insight.</text>
  <text x="1220" y="366" font-family="Verdana, Arial, sans-serif" font-size="12.5" fill="#c9c9e8" text-anchor="end">Analyst: Alice Musindo</text>
</svg>
